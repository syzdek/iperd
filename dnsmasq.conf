#
#   DNSMasq Configuration
#
#   Configure PXE/DHCP Interface:
#       DEV=eth0
#       ip link set mtu 1500        dev ${DEV}
#       ip addr add 10.0.109.254/25 dev ${DEV}  # router address
#       ip addr add 10.0.109.253/25 dev ${DEV}  # DNS service address
#       ip addr add 10.0.109.252/25 dev ${DEV}  # NTP service address
#       ip addr add 10.0.109.251/25 dev ${DEV}  # TFTP service address
#       ip addr add 10.0.109.250/25 dev ${DEV}  # HTTP/HTTPS service address
#
#   Configure PXE/DHCP firewall (iptables):
#       DEV=eth0
#       iptables -A INPUT -i ${DEV} -p udp --dport 67:68 --sport 67:68 -j ACCEPT  # BOOTP/DHCP service
#       iptables -A INPUT -i ${DEV} -p udp --dport 69  -j ACCEPT  # TFTP service
#       iptables -A INPUT -i ${DEV} -p tcp --dport 80  -j ACCEPT  # HTTP service
#       iptables -A INPUT -i ${DEV} -p tcp --dport 443 -j ACCEPT  # HTTPS service
#       iptables -A INPUT -i ${DEV} -p tcp --dport 53  -j ACCEPT  # DNS service
#       iptables -A INPUT -i ${DEV} -p udp --dport 53  -j ACCEPT  # DNS service
#
#   Start DNSMasq:
#     $ dnsmasq -C /var/lib/tftpboot/dnsmasq-httpboot.conf -i <DEVICE>
#
#   Useful dnsmasq options:
#      -C file  - configuration file
#      -h       - Don't read the hostnames in /etc/hosts.
#      -i dev   - Specify interface(s) to listen on.
#      -d       - Debug  mode:  don't  fork  to  the background
#      -R       - Don't read /etc/resolv.conf
#      -n       - Don't poll /etc/resolv.conf for changes.
#
#   Setup HTTP directory:
#     $ mkdir -p /var/lib/www
#     $ ln -s /var/lib/tftpboot /var/lib/www/httpboot
#
#   Start web server:
#
#      Option 1: busybox httpd:
#      $ busybox httpd -p 10.0.109.254:80 -h /var/lib/www -f -vv
#
#      Useful busybox httpd options:
#         -f         - don't daemonize
#         -v[v]      - verbose
#         -p IP:PORT - Bind to IP:PORT (default *:80)
#         -h HOME    - Home directory (default .)
#
#      Option 2: thttpd
#      $ thttpd -h 10.0.109.254 -d /var/lib/www -nos
#
#      Useful thttpd options:
#         -D         - don't daemonize
#         -nos       - dpn't explicit symbolic link checking
#         -d dir     - directory
#         -h host    - bind to host for multihoming
#         -p port    - secifies an alternate port number
#


# Local network
listen-address=10.0.109.254
listen-address=10.0.109.253
listen-address=10.0.109.251
listen-address=127.0.0.1


# DNS Configuration
domain-needed
resolv-file=/etc/resolv.conf
domain=pxe.iperd.org,10.0.109.128/25
address=/router.pxe.iperd.org/10.0.109.254
address=/dns.pxe.iperd.org/10.0.109.253
address=/ntp.pxe.iperd.org/10.0.109.252
address=/tftp.pxe.iperd.org/10.0.109.251
address=/http.pxe.iperd.org/10.0.109.250


# TFTP configuration
enable-tftp
tftp-root=/var/lib/tftpboot


# DHCP configuration
dhcp-range=10.0.109.129,10.0.109.199,255.255.255.128,10m


# Common DHCP options
dhcp-option=option:router,10.0.109.254
dhcp-option=option:dns-server,10.0.109.253
dhcp-option=option:ntp-server,10.0.109.252
dhcp-no-override


# PXE tagging
dhcp-vendorclass=BIOS,PXEClient:Arch:00000
dhcp-vendorclass=IA32,PXEClient:Arch:00006
dhcp-vendorclass=UEFI,PXEClient:Arch:00007
dhcp-vendorclass=UEFI,PXEClient:Arch:00009


# PXE Images
dhcp-boot=net:BIOS,boot/grub/i386-pc/core.0,tftp.pxe.iperd.org,10.0.109.251
dhcp-boot=net:UEFI,boot/grub/x86_64-efi/core.efi,tftp.pxe.iperd.org,10.0.109.251
dhcp-boot=net:IA32,boot/grub/i386-efi/core.efi,tftp.pxe.iperd.org,10.0.109.251


# end of config
